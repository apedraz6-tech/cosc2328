<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW6 - Interactive Product Calculator</title>
  <link rel="stylesheet" href="css/hw6.css">
  <script defer src="js/hw6-script.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Product Order Calculator</h1>
  </header>

  <main class="container">
    <form id="orderForm">
      <fieldset>
        <legend>Order Details</legend>

        <div class="form-group">
          <label for="product">Product</label>
          <select id="product" name="product">
            <option value="" disabled selected>-- Choose a product --</option>
            <option value="laptop">Laptop ($999.99)</option>
            <option value="tablet">Tablet ($499.99)</option>
            <option value="phone">Phone ($699.99)</option>
            <option value="monitor">Monitor ($299.99)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity (1–10)</label>
          <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
        </div>

        <div class="form-group">
          <label for="discountCode">Discount Code (optional)</label>
          <input type="text" id="discountCode" name="discountCode" placeholder="e.g. SAVE10">
        </div>

        <button type="submit">Calculate Total</button>
      </fieldset>
    </form>

    <div id="results" class="results-hidden">
      <h2>Order Summary</h2>
      <p>Product: <span id="resultProduct"></span></p>
      <p>Quantity: <span id="resultQuantity"></span></p>
      <p>Subtotal: <span id="resultSubtotal"></span></p>
      <p>Discount: <span id="resultDiscount"></span></p>
      <p>Tax (8.25%): <span id="resultTax"></span></p>
      <p class="total">Total: <span id="resultTotal"></span></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Augie Pedraza &middot; COSC 2328 &middot; Professor McCurry &middot; HW6</p>
  </footer>

  <noscript><div class="alert">Enable JavaScript to use the order calculator.</div></noscript>
</body>
</html>
